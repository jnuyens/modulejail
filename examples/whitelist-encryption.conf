# modulejail whitelist: encrypted removable media
#
# Drop-in keep-set for hosts that open encrypted external drives which are
# usually LOCKED when modulejail runs. A locked drive's modules are not
# loaded, so without this they would be treated as unused and blacklisted.
#
# Install by either merging into the default whitelist file:
#
#   cat examples/whitelist-encryption.conf >> /etc/modulejail/whitelist.conf
#   modulejail                # auto-detects the default path
#
# or pointing at it explicitly for one run:
#
#   modulejail --whitelist-file examples/whitelist-encryption.conf
#
# One module per line, '#' starts a comment. Names may use '-' or '_'.
#
# SCOPE: the desktop profile (-p desktop) already keeps the mainstream LUKS
# set (dm_crypt, aes, xts, sha256, sha512, essiv, dm_integrity), so there you
# only need the lines below that your drive uses beyond that. On the leaner
# profiles (minimal / conservative / none) keep the device-mapper and cipher
# lines too. Every line re-adds a little attack surface, so trim this to what
# `cryptsetup luksDump /dev/<disk>` reports for your volumes rather than
# keeping the whole list. `lsmod` while a drive is open shows the live set.

# --- device-mapper targets (map any encrypted volume) ---
dm_mod
dm_crypt
dm_integrity          # LUKS2 authenticated encryption

# --- default LUKS2 cipher stack (aes-xts-plain64, sha256) ---
aes_generic
aesni_intel           # AES-NI acceleration on x86-64; harmless if built-in
xts
cbc
sha256_generic
sha512_generic        # common alternate LUKS hash

# --- older LUKS1 IV mode ---
essiv

# --- alternative disk ciphers (uncomment only what luksDump shows) ---
#serpent_generic
#twofish_generic
#twofish_common
#camellia_generic

# --- modern wide-block modes used by a few removable drives ---
#hctr2
#adiantum
#nhpoly1305           # adiantum dependency
